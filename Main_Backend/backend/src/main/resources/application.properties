spring.application.name=qrshield-backend
server.port=${PORT:8080}
server.address=0.0.0.0
spring.main.allow-bean-definition-overriding=true

# MySQL Persistence Configuration
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/qrshield?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB Atlas Configuration (preserved for dual-persistence compatibility)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/qrshield}
spring.data.mongodb.repositories.type=none

# Multipart Upload (for QR image scanning)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# QRShield CyberSecurity Engine Configuration
qrshield.analysis.timeout-ms=4000
qrshield.analysis.max-redirects=5
qrshield.analysis.user-agent=QRShield-Bot/1.0 (+https://github.com/muthukumaranarc/QRShield)

# VirtualBox Sandbox Configuration
qrshield.sandbox.virtualbox.executable-path=${VBOX_EXECUTABLE_PATH:C:\\Program Files\\Oracle\\VirtualBox\\VBoxManage.exe}
qrshield.sandbox.virtualbox.base-vm-name=${VBOX_BASE_VM_NAME:qrshield-ubuntu-base}
qrshield.sandbox.virtualbox.snapshot-name=${VBOX_SNAPSHOT_NAME:clean-worker-ready}
qrshield.sandbox.virtualbox.use-linked-clones=${VBOX_USE_LINKED_CLONES:true}
qrshield.sandbox.virtualbox.host-only-interface=${VBOX_HOST_ONLY_IF:VirtualBox Host-Only Ethernet Adapter}
qrshield.sandbox.virtualbox.worker-host=${VBOX_WORKER_HOST:192.168.56.101}
qrshield.sandbox.virtualbox.worker-port=${VBOX_WORKER_PORT:8085}
qrshield.sandbox.virtualbox.worker-auth-token=${VBOX_WORKER_AUTH_TOKEN:qrshield-sandbox-secure-token-2026}
qrshield.sandbox.virtualbox.startup-timeout-seconds=${VBOX_STARTUP_TIMEOUT:45}
qrshield.sandbox.virtualbox.analysis-timeout-seconds=${VBOX_ANALYSIS_TIMEOUT:30}
qrshield.sandbox.virtualbox.max-concurrent-vms=${VBOX_MAX_CONCURRENT_VMS:2}
qrshield.sandbox.virtualbox.command-timeout-seconds=30

# Download-to-Hash Malware Detection Configuration
qrshield.malware.quarantine-dir=${QRSHIELD_QUARANTINE_DIR:./data/quarantine}
qrshield.malware.max-download-bytes=${QRSHIELD_MAX_DOWNLOAD_BYTES:26214400}
qrshield.malware.max-downloads-per-analysis=${QRSHIELD_MAX_DOWNLOADS_PER_ANALYSIS:3}
qrshield.malware.quarantine-max-bytes=${QRSHIELD_QUARANTINE_MAX_BYTES:524288000}
qrshield.malware.download-timeout-seconds=${QRSHIELD_DOWNLOAD_TIMEOUT_SECONDS:15}
qrshield.malware.reputation-enabled=${QRSHIELD_FILE_REPUTATION_ENABLED:true}
qrshield.malware.virustotal-api-key=${QRSHIELD_VIRUSTOTAL_API_KEY:4de0a1918c3ec3f893a60e9d6e7cff6498195fd1c789f40692966de51fc83ee5}
qrshield.malware.virustotal-timeout-seconds=${QRSHIELD_VIRUSTOTAL_TIMEOUT_SECONDS:5}
qrshield.malware.mock-provider-enabled=${QRSHIELD_MOCK_PROVIDER_ENABLED:true}
