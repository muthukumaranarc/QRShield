spring.application.name=qrshield-backend
server.port=${PORT:8080}

# MongoDB Atlas Configuration (dynamically injected from .env or environment variable)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/qrshield}

# Multipart Upload (for QR image scanning)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# QRShield CyberSecurity Engine Configuration
qrshield.analysis.timeout-ms=4000
qrshield.analysis.max-redirects=5
qrshield.analysis.user-agent=QRShield-Bot/1.0 (+https://github.com/muthukumaranarc/QRShield)
